<div class="min-h-screen flex items-center justify-center bg-gradient-warm p-4" dir="rtl">
  <div
    class="bg-[var(--color-card)] rounded-[var(--radius)] shadow-elegant p-8 w-full max-w-sm border border-[var(--color-border)]"
  >
    <h1 class="text-2xl text-center mb-1 text-gradient-gold">لوحة تحكم الشيف أحمد</h1>
    <p class="text-sm text-center text-[var(--color-muted-foreground)] mb-6">تسجيل دخول الإدارة</p>

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-[var(--color-foreground)] mb-1"
          >اسم المستخدم</label
        >
        <input
          type="text"
          [(ngModel)]="username"
          name="username"
          required
          class="w-full border border-[var(--color-border)] bg-[var(--color-background)] text-[var(--color-foreground)] rounded-lg px-4 py-2 text-right focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)] transition"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-[var(--color-foreground)] mb-1"
          >كلمة المرور</label
        >
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          class="w-full border border-[var(--color-border)] bg-[var(--color-background)] text-[var(--color-foreground)] rounded-lg px-4 py-2 text-right focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)] transition"
        />
      </div>

      @if (errorMessage()) {
        <p class="text-sm text-center" style="color: oklch(0.55 0.2 25)">{{ errorMessage() }}</p>
      }

      <button
        type="submit"
        [disabled]="isLoading()"
        class="w-full bg-gradient-primary text-[var(--color-primary-foreground)] rounded-lg py-2.5 font-semibold shadow-soft hover:opacity-90 transition disabled:opacity-50 cursor-pointer flex items-center justify-center h-11"
      >
        @if (isLoading()) {
          <svg
            class="animate-spin h-5 w-5"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
            ></path>
          </svg>
        } @else {
          <span>تسجيل الدخول</span>
        }
      </button>
    </form>
  </div>
</div>
